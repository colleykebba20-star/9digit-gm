<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9Digit GM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
      padding: 30px 16px;
    }

    .container {
      max-width: 760px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 48px;
      margin: 20px 0 15px;
    }

    .subtitle {
      text-align: center;
      color: #aab4c3;
      font-size: 20px;
      line-height: 1.5;
      margin-bottom: 40px;
    }

    .card {
      background: #151c25;
      border: 1px solid #303b4b;
      border-radius: 28px;
      padding: 30px;
    }

    label {
      display: block;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    input,
    select {
      width: 100%;
      padding: 20px;
      font-size: 20px;
      border-radius: 18px;
      border: 2px solid #354153;
      background: #0b0f14;
      color: white;
      margin-bottom: 28px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #2383ff;
    }

    button {
      width: 100%;
      padding: 20px;
      border: none;
      border-radius: 18px;
      background: #2383ff;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }

    .result {
      display: none;
      margin-top: 28px;
      padding: 28px;
      border: 2px solid #354153;
      border-radius: 22px;
      background: #0b0f14;
      text-align: center;
    }

    .result-label {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .number {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    .copy-btn {
      background: #2b3545;
    }

    .message {
      display: none;
      color: #ff6b6b;
      margin-top: -15px;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .note {
      text-align: center;
      color: #929dad;
      font-size: 15px;
      line-height: 1.6;
      margin-top: 35px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 42px;
      }

      .subtitle {
        font-size: 18px;
      }

      .card {
        padding: 24px;
      }

      .number {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>9Digit GM</h1>

    <div class="subtitle">
      Convert Gambian 7-digit phone numbers to the new 9-digit format.
    </div>

    <div class="card">

      <label for="phone">7-digit phone number</label>

      <input
        type="tel"
        id="phone"
        placeholder="Example: 1234567"
        maxlength="7"
        inputmode="numeric"
      >

      <div class="message" id="message">
        Please enter exactly 7 digits.
      </div>

      <label for="network">Select network</label>

      <select id="network">
        <option value="83">QCell</option>
        <option value="87">Africell</option>
        <option value="86">Comium</option>
      </select>

      <button onclick="convertNumber()">
        Convert Number
      </button>

      <div class="result" id="result">

        <div class="result-label">
          New 9-digit number:
        </div>

        <div class="number" id="newNumber"></div>

        <button class="copy-btn" onclick="copyNumber()">
          Copy Number
        </button>

      </div>

    </div>

    <div class="note">
      Prefixes shown are based on currently reported Gambian numbering information.
      Verify the official PURA numbering plan before production.
    </div>

  </div>

  <script>
    function convertNumber() {

      const phone = document.getElementById("phone").value.trim();
      const prefix = document.getElementById("network").value;
      const message = document.getElementById("message");
      const result = document.getElementById("result");
      const newNumber = document.getElementById("newNumber");

      if (!/^[0-9]{7}$/.test(phone)) {
        message.style.display = "block";
        result.style.display = "none";
        return;
      }

      message.style.display = "none";

      const converted = prefix + phone;

      newNumber.textContent = converted;
      result.style.display = "block";
    }

    function copyNumber() {

      const number = document.getElementById("newNumber").textContent;

      navigator.clipboard.writeText(number).then(function() {
        alert("Number copied: " + number);
      });
    }
  </script>

</body>
</html>
